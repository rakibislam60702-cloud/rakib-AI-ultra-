<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#102542"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <radialGradient id="glowGold1" cx="35%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FFB300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold2" cx="75%" cy="30%" r="25%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FFA000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFA000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <circle cx="280" cy="160" r="220" fill="url(#glowGold1)"/>
  <circle cx="600" cy="120" r="160" fill="url(#glowGold2)"/>
  <circle cx="160" cy="280" r="180" fill="url(#glowCyan)"/>

  <!-- Bokeh spheres -->
  <circle cx="120" cy="80" r="28" fill="#FFD54F" opacity="0.35"/>
  <circle cx="200" cy="220" r="45" fill="#FFE082" opacity="0.25"/>
  <circle cx="680" cy="240" r="35" fill="#FFCA28" opacity="0.3"/>
  <circle cx="520" cy="70" r="20" fill="#FFF59D" opacity="0.4"/>
  <circle cx="720" cy="90" r="50" fill="#FFD54F" opacity="0.2"/>
  <circle cx="380" cy="310" r="30" fill="#80DEEA" opacity="0.3"/>
  <circle cx="80" cy="320" r="40" fill="#4DD0E1" opacity="0.25"/>

  <!-- Cyber Grid -->
  <path d="M0,80 L800,80 M0,160 L800,160 M0,240 L800,240 M0,320 L800,320 M160,0 L160,400 M320,0 L320,400 M480,0 L480,400 M640,0 L640,400" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.15"/>

  <!-- Portrait Center Stylized Avatar & Glow -->
  <circle cx="400" cy="160" r="90" fill="#142848" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="400" cy="160" r="80" fill="#0D1F38"/>
  
  <!-- Stylized Hair & Face Silhouette -->
  <path d="M350,155 C350,110 370,85 400,85 C430,85 450,110 450,155 C450,185 430,205 400,205 C370,205 350,185 350,155 Z" fill="#D7A177"/>
  <path d="M340,140 C340,95 365,70 400,70 C435,70 460,95 460,140 C450,110 425,95 400,95 C375,95 350,110 340,140 Z" fill="#1A120B"/>
  <!-- Eyes & Smile -->
  <circle cx="382" cy="145" r="5" fill="#1A120B"/>
  <circle cx="418" cy="145" r="5" fill="#1A120B"/>
  <path d="M388,172 Q400,182 412,172" stroke="#1A120B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Beard -->
  <path d="M365,160 Q368,198 400,198 Q432,198 435,160" stroke="#1A120B" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
  
  <!-- Outer Ring & Tech Accents -->
  <circle cx="400" cy="160" r="105" stroke="#FFD700" stroke-width="2" stroke-dasharray="12,8" fill="none"/>
  
  <!-- Typography & Cyber Badge -->
  <rect x="250" y="295" width="300" height="42" rx="21" fill="#0A182E" stroke="#00E5FF" stroke-width="1.8"/>
  <text x="400" y="322" fill="#00E5FF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">RAKIB OFFICIAL LEAD</text>
  
  <text x="400" y="365" fill="#B0BEC5" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Carrom Aim Pro • Gemini 2.5 Vision</text>
</svg>