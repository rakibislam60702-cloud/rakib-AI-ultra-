name: Build Rakib AI Aim APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Keystore and Permissions
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        chmod +x gradlew

    - name: Auto-Detect Gradle and Build Debug APK
      run: |
        # প্রথমবার বিল্ড চালানো
        set +e
        BUILD_LOG=$(./gradlew assembleDebug --no-daemon 2>&1)
        EXIT_CODE=$?
        echo "$BUILD_LOG"

        # যদি VersionCheckPlugin কোনো নির্দিষ্ট ভার্সন দাবি করে, তবে স্বয়ংক্রিয়ভাবে তা সেট করে পুনরায় বিল্ড নেওয়া
        if [ $EXIT_CODE -ne 0 ]; then
          REQUIRED_GRADLE=$(echo "$BUILD_LOG" | grep -o -E 'Minimum supported Gradle version is [0-9.]+' | head -n 1 | awk '{print $NF}')
          
          if [ -n "$REQUIRED_GRADLE" ]; then
            echo "========================================================"
            echo ">> Auto-Fix: Upgrading Gradle wrapper to required version: $REQUIRED_GRADLE"
            echo "========================================================"
            sed -i -E "s|distributionUrl=.*|distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${REQUIRED_GRADLE}-bin.zip|" gradle/wrapper/gradle-wrapper.properties
            
            # সংশোধিত ভার্সন দিয়ে পুনরায় বিল্ড
            ./gradlew assembleDebug --no-daemon --stacktrace
            exit $?
          fi
          exit $EXIT_CODE
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rakib-AI-ultra-APK
        path: app/build/outputs/apk/debug/*.apk
        
