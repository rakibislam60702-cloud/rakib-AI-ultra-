name: Build Rakib AI Aim APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper
      run: |
        # Gradle 8.10 এ আপগ্রেড করা যেন VersionCheckPlugin পাস করে
        wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
        unzip -q gradle-8.10-bin.zip
        ./gradle-8.10/bin/gradle wrapper --gradle-version 8.10
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        # Android Debug Keystore সেটআপ
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

        # বিল্ড এক্সিকিউশন
        ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rakib-AI-ultra-APK
        path: app/build/outputs/apk/debug/*.apk
        
